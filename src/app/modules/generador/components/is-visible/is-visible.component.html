<form [formGroup]="formulario" (ngSubmit)="guardarVisibilidad()">
  <hr />
  <span class="text-bg-primary text-center">
    Visible con condici&oacute;n
  </span>
  <div>
    <label for="fichaTipoVisible">Tipo ficha</label>
    <select
      formControlName="fichaTipoVisible"
      id="fichaTipoVisible"
      class="form-control"
      (change)="cargarCategorias()"
    >
      <option value="">Seleccione</option>
      <option *ngFor="let tipo of tipoCards" [value]="tipo.nombre">
        {{ tipo.text }} - {{ tipo.tituloTexto }}
      </option>
    </select>
  </div>
  <div>
    <label for="grupoVisible">Seleccione el grupo</label>
    <select
      name="grupoVisible"
      formControlName="grupoVisible"
      id="grupoVisible"
      class="form form-control"
    >
      <option value="">Seleccione</option>
      <option *ngFor="let grupo of gruposVisiblesFiltrado" [value]="grupo.id">
        {{ grupo.title }}
      </option>
    </select>
  </div>
  <div>
    <label for="">Campo</label>
    <select name="" id="" formControlName="campo" class="form form-control">
      <option value="">Seleccione</option>
      <option *ngFor="let campos of camposVisibles" [value]="campos.columnName">
        {{ campos.label }}
      </option>
    </select>
  </div>
  <div>
    <app-date-condition-selector
      *ngIf="tipoCampo === 'calendar'"
      [condition]="dateCondition"
      (conditionChange)="onDateConditionChange($event)"
    ></app-date-condition-selector>

    <div
      *ngIf="tipoCampo === 'calendar' && calendarConditions.length > 0"
      class="mt-3"
    >
      <h6>Condiciones agregadas:</h6>
      <div class="list-group">
        <div
          *ngFor="let condition of calendarConditions; let i = index"
          class="list-group-item d-flex justify-content-between align-items-center"
        >
          <span>{{ formatearCondicion(condition) }}</span>
          <button
            type="button"
            class="btn btn-danger btn-sm"
            (click)="eliminarCondicionCalendario(i)"
          >
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>
    </div>

    <ng-container *ngIf="tipoCampo !== 'calendar'">
      <label for="condicion">Condicion inicial</label>
      <select
        class="form form-control"
        name="condicion"
        id="condicion"
        formControlName="condicion"
      >
        <option value="">Seleccione</option>
        <option
          *ngFor="let condicion of condiciones"
          [value]="condicion.condition"
        >
          {{ condicion.text }}
        </option>
      </select>
      <label for="valorCondicion">Valor de la condici&oacute;n</label>
      <select
        *ngIf="typesOptions.includes(tipoCampo)"
        formControlName="valorCondicion"
        placeholder="Condici&oacute;n"
        class="form form-control"
      >
        <option value="">Seleccione</option>
        <option *ngFor="let opcion of opciones" [value]="opcion.value">
          {{ opcion.option }}
        </option>
      </select>

      <input
        *ngIf="!typesOptions.includes(tipoCampo)"
        type="text"
        name="valorCondicion"
        id="valorCondicion"
        class="form form-control"
        formControlName="valorCondicion"
        required
      />
    </ng-container>
  </div>
  <div class="col-md-12">
    <button type="button" class="btn btn-success" (click)="agregarCondicion()">
      Agregar condicion
    </button>
  </div>
</form>
