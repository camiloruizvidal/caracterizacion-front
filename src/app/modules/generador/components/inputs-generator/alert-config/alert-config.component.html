<div class="alert-config" *ngIf="tipoPregunta && form.controls">
  <form [formGroup]="form" (ngSubmit)="onAlertaChange()">
    <div class="alert-options">
      <ng-container
        *ngIf="
          tipoPregunta === ETipoPregunta.Check ||
          tipoPregunta === ETipoPregunta.CheckSiNo
        "
      >
        <div class="option-group row mt-4">
          <div class="col-2">
            <label>{{ opcionesCheck?.valueTrue || 'Si' }}</label>
          </div>
          <div class="col-10">
            <div class="d-flex align-items-center mb-2">
              <select
                [formControlName]="opcionesCheck?.valueTrue || 'Si'"
                class="form-control"
                (change)="onAlertaChange()"
              >
                <option value="">Ninguna (0)</option>
                <option
                  *ngFor="let alerta of alertasDisponibles"
                  [value]="alerta.rango_maximo"
                  [style.color]="alerta.color"
                >
                  {{ alerta.nombre }} - ({{ alerta.rango_minimo }}-{{
                    alerta.rango_maximo
                  }})
                </option>
              </select>
              <button
                type="button"
                class="btn btn-sm btn-primary ms-2"
                (click)="agregarPlanCuidado(opcionesCheck?.valueTrue || 'Si')"
                *ngIf="form.get(opcionesCheck?.valueTrue || 'Si')?.value"
              >
                +NPC
              </button>
            </div>
            <!-- Planes de cuidado para Sí -->
            <div
              *ngIf="form.get(opcionesCheck?.valueTrue || 'Si')?.value"
              class="planes-cuidado"
            >
              <div
                *ngFor="
                  let plan of planesCuidado[opcionesCheck?.valueTrue || 'Si'];
                  let i = index
                "
                class="mt-2"
              >
                <div class="d-flex align-items-start gap-2">
                  <textarea
                    [formControlName]="
                      'planesCuidado_' +
                      (opcionesCheck?.valueTrue || 'Si') +
                      '_' +
                      i
                    "
                    class="form-control"
                    rows="2"
                    (blur)="
                      onPlanCuidadoChange(opcionesCheck?.valueTrue || 'Si', i)
                    "
                    placeholder="Descripción del plan de cuidado"
                  ></textarea>
                  <button
                    type="button"
                    class="btn btn-danger btn-sm"
                    (click)="
                      eliminarPlanCuidado(opcionesCheck?.valueTrue || 'Si', i)
                    "
                  >
                    <i class="bi bi-trash2"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="option-group row mt-4">
          <div class="col-2">
            <label>{{ opcionesCheck?.valueFalse || 'No' }}</label>
          </div>
          <div class="col-10">
            <div class="d-flex align-items-center mb-2">
              <select
                [formControlName]="opcionesCheck?.valueFalse || 'No'"
                class="form-control"
                (change)="onAlertaChange()"
              >
                <option value="">Ninguna (0)</option>
                <option
                  *ngFor="let alerta of alertasDisponibles"
                  [value]="alerta.rango_maximo"
                  [style.color]="alerta.color"
                >
                  {{ alerta.nombre }} - ({{ alerta.rango_minimo }}-{{
                    alerta.rango_maximo
                  }})
                </option>
              </select>
              <button
                type="button"
                class="btn btn-sm btn-primary ms-2"
                (click)="agregarPlanCuidado(opcionesCheck?.valueFalse || 'No')"
                *ngIf="form.get(opcionesCheck?.valueFalse || 'No')?.value"
              >
                +NPC
              </button>
            </div>
            <!-- Planes de cuidado para No -->
            <div
              *ngIf="form.get(opcionesCheck?.valueFalse || 'No')?.value"
              class="planes-cuidado"
            >
              <div
                *ngFor="
                  let plan of planesCuidado[opcionesCheck?.valueFalse || 'No'];
                  let i = index
                "
                class="mt-2"
              >
                <div class="d-flex align-items-start gap-2">
                  <textarea
                    [formControlName]="
                      'planesCuidado_' +
                      (opcionesCheck?.valueFalse || 'No') +
                      '_' +
                      i
                    "
                    class="form-control"
                    rows="2"
                    (blur)="
                      onPlanCuidadoChange(opcionesCheck?.valueFalse || 'No', i)
                    "
                    placeholder="Descripción del plan de cuidado"
                  ></textarea>
                  <button
                    type="button"
                    class="btn btn-danger btn-sm"
                    (click)="
                      eliminarPlanCuidado(opcionesCheck?.valueFalse || 'No', i)
                    "
                  >
                    <i class="bi bi-trash2"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </ng-container>

      <ng-container
        *ngIf="
          (tipoPregunta === ETipoPregunta.Select ||
            tipoPregunta === ETipoPregunta.SelectMultiple) &&
          opciones?.length
        "
      >
        <div class="container-fluid" *ngFor="let opcion of opciones">
          <div class="row">
            <div class="col-4 mt-2">
              <label>
                {{ opcion.value }}) <strong> {{ opcion.option }}</strong>
              </label>
            </div>
            <div class="col-8">
              <div class="d-flex align-items-center mb-2">
                <select
                  [formControlName]="opcion.value"
                  class="form-control"
                  (change)="onAlertaChange()"
                >
                  <option value="">Ninguna (0)</option>
                  <option
                    *ngFor="let alerta of alertasDisponibles"
                    [value]="alerta.rango_maximo"
                    [style.color]="alerta.color"
                  >
                    {{ alerta.nombre }} - ({{ alerta.rango_minimo }}-{{
                      alerta.rango_maximo
                    }})
                  </option>
                </select>
                <button
                  type="button"
                  class="btn btn-sm btn-primary ms-2"
                  (click)="agregarPlanCuidado(opcion.value)"
                  *ngIf="form.get(opcion.value)?.value"
                >
                  +NPC
                </button>
              </div>
            </div>
            <div class="col-12">
              <!-- Planes de cuidado para opciones -->
              <div *ngIf="form.get(opcion.value)?.value" class="planes-cuidado">
                <div
                  *ngFor="
                    let plan of planesCuidado[opcion.value];
                    let i = index
                  "
                  class="mt-2"
                >
                  <div class="d-flex align-items-start gap-2">
                    <textarea
                      [formControlName]="
                        'planesCuidado_' + opcion.value + '_' + i
                      "
                      class="form-control"
                      rows="2"
                      (blur)="onPlanCuidadoChange(opcion.value, i)"
                      placeholder="Descripción del plan de cuidado"
                    ></textarea>
                    <button
                      type="button"
                      class="btn btn-danger btn-sm"
                      (click)="eliminarPlanCuidado(opcion.value, i)"
                    >
                      <i class="bi bi-trash2"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </ng-container>
    </div>
  </form>
</div>
