<div class="contenedor-login">
  <!-- Loading overlay temporal (comentado mientras se arregla el error) -->
  <!-- <app-loading-overlay 
    [isVisible]="isLoading"
    mainText="Iniciando sesión..."
    subText="Por favor espere, no cierre la página">
  </app-loading-overlay> -->

  <div class="tarjeta-login">
    <h2 class="titulo">Bienvenido al sistema de caracterización</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <input
          type="text"
          class="form-control"
          formControlName="username"
          placeholder="Email o nombre de usuario"
          data-cy="username"
        />
        <div
          *ngIf="
            loginForm.get('username')?.invalid &&
            loginForm.get('username')?.touched
          "
          class="mensaje-error"
          data-cy="username-error"
        >
          Usuario es requerido.
        </div>
      </div>

      <div class="form-group">
        <input
          type="password"
          class="form-control"
          formControlName="password"
          placeholder="Contraseña"
          data-cy="password"
        />
        <div
          *ngIf="
            loginForm.get('password')?.invalid &&
            loginForm.get('password')?.touched
          "
          class="mensaje-error"
          data-cy="password-error"
        >
          Contraseña es requerida.
        </div>
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid || isLoading"
        class="boton-iniciar"
        data-cy="login-button"
      >
        <span *ngIf="!isLoading">Iniciar Sesión</span>
        <span *ngIf="isLoading">Iniciando sesión...</span>
      </button>

      <!-- Mensaje de error debajo del botón -->
      <div *ngIf="errorMessage" class="error-message" data-cy="login-error">
        {{ errorMessage }}
      </div>
    </form>
  </div>
</div>
