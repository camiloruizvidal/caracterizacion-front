<div class="card">
  <div class="card-body">
    <h5 class="card-title">Ver Carga Masiva</h5>
    <div class="card-body">
      <div class="row">
        <div class="table-responsive">
          <div class="row mb-3 align-items-center">
            <div class="col-auto">
              <label class="me-2">Versión de la ficha:</label>
              <select
                class="form-select form-select-sm d-inline-block w-auto"
                [(ngModel)]="versionSeleccionada"
                (change)="cargarRegistros()"
              >
                <option value="">Seleccione</option>
                <option [value]="version.id" *ngFor="let version of versiones">
                  {{ version.nombre }}
                </option>
              </select>
            </div>
          </div>

          <table class="table table-striped">
            <thead>
              <tr>
                <th>#</th>
                <th *ngFor="let columna of obtenerColumnas()">
                  {{ columna | titlecase }}
                </th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let registro of registros; let i = index">
                <td>{{ (paginaActual - 1) * registrosPorPagina + i + 1 }}</td>
                <td *ngFor="let columna of obtenerColumnas()">
                  {{ registro[columna] }}
                </td>
              </tr>
            </tbody>
          </table>

          <nav aria-label="Navegación de páginas">
            <ul class="pagination">
              <li class="page-item" [class.disabled]="paginaActual === 1">
                <a
                  class="page-link"
                  href="#"
                  (click)="
                    $event.preventDefault(); cambiarPagina(paginaActual - 1)
                  "
                  >Anterior</a
                >
              </li>
              <li class="page-item" *ngFor="let pagina of obtenerPaginas()">
                <a
                  class="page-link"
                  href="#"
                  [class.active]="paginaActual === pagina"
                  (click)="$event.preventDefault(); cambiarPagina(pagina)"
                >
                  {{ pagina }}
                </a>
              </li>
              <li
                class="page-item"
                [class.disabled]="paginaActual === totalPaginas"
              >
                <a
                  class="page-link"
                  href="#"
                  (click)="
                    $event.preventDefault(); cambiarPagina(paginaActual + 1)
                  "
                  >Siguiente</a
                >
              </li>
            </ul>
          </nav>
          <div class="col-auto">
            <label class="me-2">Registros por página:</label>
            <select
              class="form-select form-select-sm d-inline-block w-auto"
              [(ngModel)]="registrosPorPagina"
              (change)="cambiarLimite()"
            >
              <option [value]="1">1</option>
              <option [value]="5">5</option>
              <option [value]="10">10</option>
              <option [value]="25">25</option>
              <option [value]="50">50</option>
              <option [value]="100">100</option>
            </select>
          </div>
          <div class="col-md-12">
            <span class="text-muted">
              Página {{ paginaActual }} de {{ totalPaginas }} | Total:
              {{ totalRegistros }} registros
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
