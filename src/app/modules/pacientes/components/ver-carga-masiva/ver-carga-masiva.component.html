<div class="card">
  <div class="card-body">
    <h5 class="card-title">Ver Carga Masiva</h5>
    <div class="card-body">
      <div class="row">
        <div class="col-md-12">
          <div *ngIf="cargando" class="text-center">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Cargando...</span>
            </div>
          </div>

          <div
            *ngIf="!cargando && registros.length > 0"
            class="table-responsive"
          >
            <table class="table table-striped">
              <thead>
                <tr>
                  <th *ngFor="let columna of obtenerColumnas()">
                    {{ columna | titlecase }}
                  </th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let registro of registros">
                  <td *ngFor="let columna of obtenerColumnas()">
                    {{ registro[columna] }}
                  </td>
                </tr>
              </tbody>
            </table>

            <nav *ngIf="totalPaginas > 1" aria-label="Navegación de páginas">
              <ul class="pagination justify-content-center">
                <li class="page-item" [class.disabled]="paginaActual === 1">
                  <a
                    class="page-link"
                    href="#"
                    (click)="
                      $event.preventDefault(); cambiarPagina(paginaActual - 1)
                    "
                    >Anterior</a
                  >
                </li>
                <li class="page-item" *ngFor="let pagina of obtenerPaginas()">
                  <a
                    class="page-link"
                    href="#"
                    [class.active]="paginaActual === pagina"
                    (click)="$event.preventDefault(); cambiarPagina(pagina)"
                  >
                    {{ pagina }}
                  </a>
                </li>
                <li
                  class="page-item"
                  [class.disabled]="paginaActual === totalPaginas"
                >
                  <a
                    class="page-link"
                    href="#"
                    (click)="
                      $event.preventDefault(); cambiarPagina(paginaActual + 1)
                    "
                    >Siguiente</a
                  >
                </li>
              </ul>
            </nav>
          </div>

          <div
            *ngIf="!cargando && registros.length === 0"
            class="alert alert-info"
          >
            No hay registros disponibles para mostrar.
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
