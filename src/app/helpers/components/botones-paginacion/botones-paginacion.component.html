<!-- Paginador ULTRA PREMIUM unificado -->
<div class="pagination-luxury-unified" *ngIf="dataPagination && dataPagination.totalItems > 0">
  
  <!-- Parte superior: Controles y información -->
  <div class="luxury-top-section">
    <!-- Selector de registros premium -->
    <div class="luxury-selector-group">
      <div class="luxury-label">
        <i class="bi bi-gear-fill luxury-icon"></i>
        <span class="luxury-text">Registros por página</span>
      </div>
      <div class="luxury-select-wrapper">
        <select
          class="luxury-select"
          id="itemsPerPage"
          [(ngModel)]="itemsPerPage"
          (change)="onItemsPerPageChange($event)"
        >
          <option value="5">5 registros</option>
          <option value="10">10 registros</option>
          <option value="20">20 registros</option>
          <option value="50">50 registros</option>
          <option value="100">100 registros</option>
          <option value="200">200 registros</option>
        </select>
        <div class="luxury-select-arrow">
          <i class="bi bi-chevron-down"></i>
        </div>
      </div>
    </div>

    <!-- Información de página premium -->
    <div class="luxury-info-panel">
      <div class="luxury-info-primary">
        <span class="luxury-page-current">{{ dataPagination.currentPage }}</span>
        <span class="luxury-separator">de</span>
        <span class="luxury-page-total">{{ dataPagination.totalPages }}</span>
      </div>
      <div class="luxury-info-secondary">
        <i class="bi bi-database-fill luxury-info-icon"></i>
        <span class="luxury-total-count">{{ dataPagination.totalItems }} registros</span>
      </div>
    </div>
  </div>

  <!-- Parte inferior: Navegación -->
  <div class="luxury-bottom-section">
    <div class="luxury-nav-wrapper">
      
      <!-- Todos los botones unidos en un solo grupo -->
      <div class="luxury-unified-buttons">
        
        <!-- Botón ULTRA PREMIUM - Primera página -->
        <button
          class="luxury-nav-btn luxury-nav-first"
          [disabled]="dataPagination.currentPage <= 1"
          (click)="changePage(1)"
          [title]="'Ir a la primera página'"
        >
          <i class="bi bi-skip-start-fill"></i>
        </button>
        
        <!-- Botón ULTRA PREMIUM - Página anterior -->
        <button
          class="luxury-nav-btn luxury-nav-prev"
          [disabled]="dataPagination.currentPage <= 1"
          (click)="changePage(dataPagination.currentPage - 1)"
          [title]="'Página anterior'"
        >
          <i class="bi bi-chevron-left"></i>
        </button>
        
        <!-- Números de página PREMIUM -->
        <ng-container *ngFor="let page of getPages()">
          <button
            class="luxury-page-btn"
            [class.luxury-page-active]="page === dataPagination.currentPage"
            (click)="changePage(page)"
            [title]="'Ir a la página ' + page"
          >
            {{ page }}
          </button>
        </ng-container>
        
        <!-- Botón ULTRA PREMIUM - Página siguiente -->
        <button
          class="luxury-nav-btn luxury-nav-next"
          [disabled]="dataPagination.currentPage >= dataPagination.totalPages"
          (click)="changePage(dataPagination.currentPage + 1)"
          [title]="'Página siguiente'"
        >
          <i class="bi bi-chevron-right"></i>
        </button>
        
        <!-- Botón ULTRA PREMIUM - Última página -->
        <button
          class="luxury-nav-btn luxury-nav-last"
          [disabled]="dataPagination.currentPage >= dataPagination.totalPages"
          (click)="changePage(dataPagination.totalPages)"
          [title]="'Ir a la última página'"
        >
          <i class="bi bi-skip-end-fill"></i>
        </button>
        
      </div>
    
  </div>
  
  <!-- Indicador de progreso premium -->
  <div class="luxury-progress-bar">
    <div 
      class="luxury-progress-fill" 
      [style.width.%]="(dataPagination.currentPage / dataPagination.totalPages) * 100"
    ></div>
  </div>
  
</div>
